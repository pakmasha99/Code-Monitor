version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: code-monitor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab123}
      POSTGRES_DB: ${POSTGRES_DB:-code_monitor}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - code-monitor-network

  redis:
    image: redis:7-alpine
    container_name: code-monitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - code-monitor-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  code-monitor-network:
    driver: bridge
